name: vaster_workspace
description: Vaster LLM Virtual Machine Workspace.
version: 0.4.0

environment:
  sdk: ^3.13.0-282.1.beta

workspace:
  # compiler
  - packages/compiler/vaster_ast
  - packages/compiler/vaster_compiler
  - packages/compiler/vaster_domain
  # isa
  - packages/isa/vaster_conformance
  - packages/isa/vaster_instruction
  # model
  - packages/model/vaster_cancellation
  - packages/model/vaster_kv
  - packages/model/vaster_model
  - packages/model/vaster_pricing
  - packages/model/vaster_token_estimate
  # runtime
  - packages/runtime/vaster_budget
  - packages/runtime/vaster_events
  - packages/runtime/vaster_machine_state
  - packages/runtime/vaster_metering
  - packages/runtime/vaster_policy
  - packages/runtime/vaster_policy_engine
  - packages/runtime/vaster_resources
  - packages/runtime/vaster_runtime
  - packages/runtime/vaster_scheduler
  - packages/runtime/vaster_vm
  - packages/runtime/vaster_vm_api
  # subsystems
  - packages/subsystems/vaster_agent
  - packages/subsystems/vaster_agent_basic
  - packages/subsystems/vaster_agent_descriptor
  - packages/subsystems/vaster_agent_manager
  - packages/subsystems/vaster_agent_manager_advanced
  - packages/subsystems/vaster_agent_messaging
  - packages/subsystems/vaster_context
  - packages/subsystems/vaster_context_manager
  - packages/subsystems/vaster_filesystem
  - packages/subsystems/vaster_filesystem_local
  - packages/subsystems/vaster_filesystem_manager
  - packages/subsystems/vaster_filesystem_memory
  - packages/subsystems/vaster_sandbox
  - packages/subsystems/vaster_sandbox_ffi
  - packages/subsystems/vaster_sandbox_isolate
  - packages/subsystems/vaster_sandbox_manager
  - packages/subsystems/vaster_sandbox_process
  - packages/subsystems/vaster_session
  - packages/subsystems/vaster_session_manager
  - packages/subsystems/vaster_tool
  - packages/subsystems/vaster_tool_manager
  # bridges
  - packages/bridges/vaster_checkpoint
  - packages/bridges/vaster_context_mmu
  - packages/bridges/vaster_continuation
  - packages/bridges/vaster_continuation_manager
  - packages/bridges/vaster_replay
  # backends
  - packages/backends/vaster_kv_mmap
  - packages/backends/vaster_llama_ffi
  - packages/backends/vaster_model_claude_api
  - packages/backends/vaster_model_claude_cli
  - packages/backends/vaster_model_fake
  - packages/backends/vaster_model_gemini_cli
  - packages/backends/vaster_model_google_ai
  - packages/backends/vaster_model_llama_cpp
  # transports
  - packages/transports/vaster_mmap
  - packages/transports/vaster_model_rpc
  - packages/transports/vaster_model_rpc_server
  # analysis
  - packages/analysis/vaster_calibration
  - packages/analysis/vaster_check
  - packages/analysis/vaster_debug
  - packages/analysis/vaster_dis
  - packages/analysis/vaster_eval
  # host
  - packages/host/vaster
  - packages/host/vaster_benchmarks
  - packages/host/vaster_cli
  - packages/host/vaster_playground
