name: vaster_calibration
description: Estimate calibration for Vaster — fitted per-backend token-ratio profiles as data, a calibrated TokenEstimator composed beside the canonical heuristic, and a fitter that learns profiles from recorded replay tapes.
version: 0.4.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0-282.1.beta

dependencies:
  vaster_model:
    path: ../../model/vaster_model
  vaster_replay:
    path: ../../bridges/vaster_replay
  vaster_token_estimate:
    path: ../../model/vaster_token_estimate

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
