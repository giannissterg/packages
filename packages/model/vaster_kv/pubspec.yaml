name: vaster_kv
description: Physical KV-state contracts for Vaster — KvCacheHandle, KvCacheController, and capabilities; the backend-agnostic interface between virtual context and physical LLM cache state.
version: 0.5.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0-282.1.beta

# Deliberately (nearly) a leaf: backend/model packages depend on these
# contracts, so nothing context-shaped may enter here (rules.md Rule
# 6.15, enforced by test/leaf_guard_test.dart). vaster_token_estimate is
# the one sanctioned dep — estimates are centralized, never inline
# heuristics (Rule 6.12).
dependencies:
  vaster_token_estimate:
    path: ../../model/vaster_token_estimate

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
