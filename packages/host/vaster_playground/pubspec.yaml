name: vaster_playground
description: A complex multi-agent pipeline playground showcasing the full vaster compiler and VM ecosystem.
version: 0.4.0

resolution: workspace

environment:
  sdk: ^3.13.0-282.1.beta

dependencies:
  vaster_ast:
  vaster_budget:
  vaster_compiler:
  vaster_continuation:
  vaster_continuation_manager:
  vaster_dis:
  vaster_domain:
  vaster_instruction:
  vaster_model:
  vaster_model_claude_cli:
  vaster_model_fake:
  vaster_model_gemini_cli:
  vaster_model_google_ai:
  vaster_model_rpc:
  vaster_model_rpc_server:
  vaster_policy:
  vaster_replay:
  vaster_runtime:
  vaster_scheduler:
  vaster_vm:

dev_dependencies:
  vaster_check:
    path: ../../analysis/vaster_check
  vaster_checkpoint:
  vaster_debug:
  lints: ^6.0.0
  test: ^1.25.6
