name: vaster_context_mmu
description: The bridge between virtual context and physical KV state — the ContextMmu page table that binds pinned context regions to materialized KV-cache handles through any KvCacheController backend.
version: 0.4.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0-282.1.beta

dependencies:
  vaster_context:
    path: ../vaster_context
  vaster_context_manager:
    path: ../vaster_context_manager
  vaster_kv:
    path: ../vaster_kv
  vaster_model:
    path: ../vaster_model

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
