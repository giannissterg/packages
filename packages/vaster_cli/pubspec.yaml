name: vaster_cli
description: Official command-line interface for running, disassembling, serving, and inspecting Vaster LLM Virtual Machine pipelines.
version: 0.3.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0

executables:
  vaster: vaster_cli

dependencies:
  args: ^2.6.0
  vaster_compiler:
    path: ../vaster_compiler
  vaster_instruction:
    path: ../vaster_instruction
  vaster_debug:
    path: ../vaster_debug
  vaster_dis:
    path: ../vaster_dis
  vaster_model:
    path: ../vaster_model
  vaster_model_claude_api:
    path: ../vaster_model_claude_api
  vaster_model_claude_cli:
    path: ../vaster_model_claude_cli
  vaster_model_fake:
    path: ../vaster_model_fake
  vaster_model_gemini_cli:
    path: ../vaster_model_gemini_cli
  vaster_model_google_ai:
    path: ../vaster_model_google_ai
  vaster_model_rpc:
    path: ../vaster_model_rpc
  vaster_model_rpc_server:
    path: ../vaster_model_rpc_server
  vaster_replay:
    path: ../vaster_replay
  vaster_vm:
    path: ../vaster_vm

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
