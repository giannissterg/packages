name: vaster_kv_mmap
description: Zero-copy shared-memory KV cache controller for Vaster — physical context frames in POSIX shared memory, attachable across processes.
version: 0.4.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0-282.1.beta

dependencies:
  vaster_kv:
    path: ../../model/vaster_kv
  vaster_mmap:
    path: ../../transports/vaster_mmap
  vaster_token_estimate:
    path: ../../model/vaster_token_estimate

dev_dependencies:
  vaster_context_mmu:
    path: ../../bridges/vaster_context_mmu
  lints: ^6.0.0
  test: ^1.25.6
  vaster_context:
    path: ../../subsystems/vaster_context
  vaster_context_manager:
    path: ../../subsystems/vaster_context_manager
  vaster_model:
    path: ../../model/vaster_model
