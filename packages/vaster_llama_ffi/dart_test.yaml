# One suite at a time: llama_backend_init and model loading race when
# several test isolates bind libllama concurrently, and real-inference
# determinism assertions shouldn't share CPU with each other either.
concurrency: 1

tags:
  llama:
    description: >-
      Real llama.cpp inference — needs libllama (brew llama.cpp) and the
      small test model from the ZC-P0 setup; tests skip themselves with a
      pointer when either is absent.
