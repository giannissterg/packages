name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Analyze + test (incl. fixture replay)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          # Workspace resolution requires the beta the repo pins in
          # pubspec.yaml (sdk: ^3.13.0-282.1.beta).
          sdk: beta

      - name: Resolve workspace
        run: dart pub get

      - name: Analyze (zero tolerance — infos included)
        run: dart analyze --fatal-infos packages

      - name: Test sweep
        # gemini_cli integration tests are auth-gated and hang headless.
        # The sweep includes the committed SDD fidelity fixture replay —
        # a zero-cost end-to-end run of compiler → runtime → metering
        # against real recorded model traffic (exact token/cost totals).
        run: |
          for d in packages/*/test; do echo "${d%/test}"; done \
            | grep -v gemini_cli \
            | xargs dart test --reporter expanded --file-reporter json:test-results.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.json
          retention-days: 14
