name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Analyze + test sweep (incl. fixture replay)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          # Workspace resolution requires the beta the repo pins in
          # pubspec.yaml (sdk: ^3.13.0-282.1.beta).
          sdk: beta

      - name: Resolve workspace
        run: dart pub get

      - name: Analyze (zero tolerance — infos included)
        run: dart analyze --fatal-infos packages

      - name: Rule 11 ratchet (void signatures only go down)
        # Counts production void/Future<void> signatures per package
        # against tool/rule11_baseline.txt — a rise fails (new void API),
        # a fall fails until the baseline is tightened. Migration plan:
        # the rule11 void-migration plan; sink ledger in the baseline file.
        run: ./tool/rule11_ratchet.sh

      - name: Test sweep
        # One owner for the sweep, shared with local runs
        # (tool/test_sweep.sh). Per-package invocation is load-bearing:
        # it honors each package's dart_test.yaml (the llama suites'
        # concurrency guard against llama_backend_init races, tag
        # declarations) — a single root-level `dart test` across
        # packages does not. Machine-gated suites degrade honestly:
        # llama real-inference self-skips without GGUF + libllama, and
        # gemini CLI integration is opt-in (VASTER_GEMINI_CLI_TESTS=1 —
        # auth-gated gemini hangs headless), so its unit tests still
        # run here.
        #
        # The sweep includes the committed SDD fidelity fixture replay —
        # a zero-cost end-to-end run of compiler → runtime → metering
        # against real recorded model traffic (exact token/cost totals) —
        # the reliability benchmark set (vaster_benchmarks: gate 4's
        # tape + fault-injection evidence, docs/RELIABILITY.md), and
        # every architectural guard test (vaster_kv leaf guard,
        # checkpoint-anywhere gauntlet, KV State Image golden bytes,
        # quickstart anti-rot mirror). See docs/ARCHITECTURE.md's
        # enforcement table.
        run: ./tool/test_sweep.sh
